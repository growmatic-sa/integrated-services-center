<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | مركز الخدمات المتكاملة</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A2A5A">
<link rel="icon" href="assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="assets/brand/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{if(localStorage.getItem('isc-lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
</head>
<body data-page="login">
<div id="site-header"></div>
<main>
  <section class="auth-page">
    <div class="container">
      <div class="auth-card reveal">
        <h1 data-en="Welcome to Integrated Services Center">أهلاً بك في مركز الخدمات المتكاملة</h1>
        <p data-en="Log in or create an account to post ads, send detailed requests and track everything in one place.">سجّل دخولك أو أنشئ حساباً لإضافة إعلاناتك وإرسال طلباتك ومتابعتها من مكان واحد.</p>
        <div id="authHolder"></div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>

<script src="assets/js/vendor/lucide.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/listings.js"></script>
<script src="assets/js/propschema.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/forms.js"></script>
<script>
(function () {
  var ISC = window.ISC;
  var q = new URLSearchParams(location.search);
  var next = q.get('next') || 'account.html';
  if (!/^[\w\-.\/]+(\?[\w=&%-]*)?(#[\w-]*)?$/.test(next) || next.indexOf('//') >= 0) next = 'account.html';
  ISC.onReady = function () {
    var holder = document.getElementById('authHolder');
    if (!ISC.A.online) { holder.innerHTML = '<div class="notice"><div><b>' + ISC.T('الخدمة غير متاحة حالياً', 'Service unavailable') + '</b><p>' + ISC.T('تعذّر الاتصال بالخادم.', 'Could not reach the server.') + '</p></div></div>'; return; }
    if (ISC.A.user) { location.replace(next); return; }
    ISC.forms.mountAuth(holder, { mode: q.get('mode') === 'register' ? 'register' : 'login', onDone: function () { location.href = next; } });
  };
})();
</script>
</body>
</html>
